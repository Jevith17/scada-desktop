name: Build Windows Executable (.exe)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build PaintWise for Windows (x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails CLI
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Build Windows Application (.exe)
        shell: bash
        run: |
          wails build -platform windows/amd64

      - name: Package Windows Distribution Zip
        shell: bash
        run: |
          mkdir -p release-pkg
          cp build/bin/PaintWise.exe release-pkg/
          cp config.yaml release-pkg/
          cp -r templates release-pkg/ 2>/dev/null || true
          cd release-pkg && 7z a ../PaintWise-Windows-x64.zip *

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PaintWise-Windows-x64
          path: PaintWise-Windows-x64.zip
          retention-days: 30
